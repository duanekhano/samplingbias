[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duanekhano-samplingbias"
version = "0.1.0"
description = "比较采样规则与真实流量分布，算出各分段的指标偏移"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "duanekhano" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://duanekhano.github.io"
Repository = "https://github.com/duanekhano/samplingbias"
Issues = "https://github.com/duanekhano/samplingbias/issues"

[project.scripts]
samplingbias = "samplingbias:main"

[tool.setuptools]
py-modules = ["samplingbias"]
